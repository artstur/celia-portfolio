{{- $accent := .Params.accent_color | default "rgb(202, 193, 210)" | safeCSS -}}
<style>
  :root {
    --accent-color: {{ $accent }};
  }
  /* Problem Space 区块背景色 */
  .site-work-detail-page {
    background-color: {{ with .Params.accent_surface_color }}{{ . | safeCSS }}{{ else }}var(--accent-color){{ end }} !important;
  }
  {{ with .Params.accent_surface_color }}
  .site-work-detail-page-header h3 {
    color: var(--accent-color);
  }
  .site-work-detail-page-header h3::after {
    background-color: var(--accent-color);
  }
  {{ end }}
  /* Problem Space 区块内的正文与链接：文字直接落在 accent 底色上，
     需要按底色重新算，不能沿用页面默认的 $text-color。
     accent 取 20% 混纯黑是能让所有在用 accent 都过 WCAG AA 的最高比例
     （最深的 buffet #7B8C72 也能到 4.78:1）。 */
  .site-work-detail-page-header p,
  .site-work-detail-page-more p,
  .site-work-detail-page-header a,
  .site-work-detail-page-more a {
    color: color-mix(in srgb, var(--accent-color) 20%, #000) !important;
  }
  /* 首屏信息框标题和内容颜色 */
  .site-work-detail-front-info-title h2,
  .site-work-detail-front-info-content p {
    color: var(--accent-color) !important;
  }
  /* Learn More 按钮 */
  .site-work-detail-front-info-btn a {
    background-color: var(--accent-color) !important;
    border-color: var(--accent-color) !important;
  }
  .site-work-detail-front-info-btn a:hover {
    background-color: white !important;
    color: var(--accent-color) !important;
    border-color: var(--accent-color) !important;
  }
  @media (max-width: 575px) {
    .site-work-detail-front-info-title {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .site-work-detail-front-info-content p {
      color: color-mix(in srgb, var(--accent-color) 55%, #000) !important;
    }
  }
</style>
