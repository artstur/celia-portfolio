{{- $accent := .Params.accent_color | default "rgb(202, 193, 210)" | safeCSS -}}
<style>
  :root {
    --accent-color: {{ $accent }};
  }
  /* Problem Space 区块背景色 */
  .site-work-detail-page {
    background-color: var(--accent-color) !important;
  }
  /* 首屏信息框标题和内容颜色 */
  .site-work-detail-front-info-title h2,
  .site-work-detail-front-info-content p {
    color: var(--accent-color) !important;
  }
  /* Learn More 按钮 */
  .site-work-detail-front-info-btn a {
    background-color: var(--accent-color) !important;
    border-color: var(--accent-color) !important;
  }
  .site-work-detail-front-info-btn a:hover {
    background-color: white !important;
    color: var(--accent-color) !important;
    border-color: var(--accent-color) !important;
  }
  @media (max-width: 575px) {
    .site-work-detail-front-info-title {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .site-work-detail-front-info-content p {
      color: color-mix(in srgb, var(--accent-color) 55%, #000) !important;
    }
  }
</style>
