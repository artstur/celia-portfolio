<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="584" viewBox="0 0 1440 584" role="img" aria-labelledby="title desc">
  <title id="title">Along technical architecture overview</title>
  <desc id="desc">iPhone exchanges chat, selected health summaries and task updates with a paired Mac Host. Along Agent runs in DeepSeek Harness. Source and Engine persist and dispatch work; chat passes through a Router, while health and due-work events can dispatch a Worker directly. The Worker reads context and governed memories and commits structured changes through ownership, scope and version checks. Business state and orchestration have separate SQLite stores. MemoryService uses the Hy-Memory SDK. Configured remote services supply model inference and embeddings. Raw HealthKit samples stay on iPhone and model credentials stay on the Mac.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#806b92" stroke-width="1.2"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#302b36}
      .kicker{font-size:12.5px;font-weight:700;letter-spacing:1.1px;fill:#806b92}
      .title{font-size:20px;font-weight:600}
      .body{font-size:16px;fill:#5c5565}
      .small{font-size:14px;fill:#6c6474}
      .note{font-size:12.5px;fill:#817889}
      .box{fill:#fff;stroke:#e0d8e7;stroke-width:1}
      .flow{fill:none;stroke:#806b92;stroke-width:1.35;marker-end:url(#arrow)}
      .both{marker-start:url(#arrow)}
      .context{stroke-dasharray:4 4}
    </style>
  </defs>
